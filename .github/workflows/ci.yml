name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/ci.yml'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: cd docker && uv sync --frozen

      - name: Run lint
        run: cd docker && uv run poe lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: cd docker && uv sync --frozen

      - name: Run tests
        run: cd docker && uv run poe test
